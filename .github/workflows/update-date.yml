
name: Update website date

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Generate date
        run: |
          mkdir -p _data
          echo "date: \"$(date -u +'%B %-d, %Y')\"" > _data/last_updated.yml

      - name: Commit date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/last_updated.yml
          git diff --cached --quiet || git commit -m "Update website date"
          git push
